name: build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    name: Windows DLL
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build realbot2_mm.dll
        run: msbuild realbot2_mm.vcxproj /m /p:Configuration=Release /p:Platform=Win32

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: realbot2-windows
          path: Release/realbot2_mm.dll
          if-no-files-found: error

  linux:
    name: Linux .so
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install 32-bit toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-multilib

      - name: Build realbot2_mm_i386.so
        run: make

      - name: Upload Linux build
        uses: actions/upload-artifact@v4
        with:
          name: realbot2-linux
          path: realbot2_mm_i386.so
          if-no-files-found: error

  package:
    name: Release package
    needs: [ windows, linux ]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download builds
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare package
        run: |
          mkdir -p dist/cstrike/addons/realbot2/dll dist/cstrike/addons/realbot2/data dist/cstrike/addons/realbot2/tools
          cp -R bin/data/. dist/cstrike/addons/realbot2/data/
          cp -R bin/tools/. dist/cstrike/addons/realbot2/tools/ 2>/dev/null || true
          cp bin/bot.cfg bin/rb_names.txt bin/commandmenu.txt bin/install.txt bin/start_server.bat dist/cstrike/addons/realbot2/
          cp README.md dist/cstrike/addons/realbot2/
          cp bin/realbot2_keys.cfg dist/cstrike/
          cp artifacts/realbot2-windows/realbot2_mm.dll dist/cstrike/addons/realbot2/dll/
          cp artifacts/realbot2-linux/realbot2_mm_i386.so dist/cstrike/addons/realbot2/dll/
          cp LICENSE dist/cstrike/addons/realbot2/
          cp docs/REALBOT-ORIGINAL-README.md dist/cstrike/addons/realbot2/
          find dist -name .gitkeep -delete
          cd dist
          zip -r ../REALBOT2-2.1.2.zip .

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: REALBOT2-package
          path: REALBOT2-2.1.2.zip
          if-no-files-found: error

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: REALBOT2-2.1.2.zip
          generate_release_notes: true
