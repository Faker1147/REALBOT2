// ============================================================
//  REALBOT2 - numeric keypad menu bindings (client side)
// ============================================================
//
//  Copy this file to your Counter-Strike 1.6 cstrike folder:
//      ...\Half-Life\cstrike\realbot2_keys.cfg
//
//  Then add this line to cstrike\autoexec.cfg (or type it once
//  in the client console):
//      exec realbot2_keys.cfg
//
//  The menu itself is rendered by the REALBOT2 server plugin.
//  It only works for the host of a listen server.
// ============================================================

bind "KP_INS"         "realbot2_menu"
bind "KP_END"         "realbot2_menu 1"
bind "KP_DOWNARROW"   "realbot2_menu 2"
bind "KP_PGDN"        "realbot2_menu 3"
bind "KP_LEFTARROW"   "realbot2_menu 4"
bind "KP_5"           "realbot2_menu 5"
bind "KP_RIGHTARROW"  "realbot2_menu 6"
bind "KP_HOME"        "realbot2_menu 7"
bind "KP_UPARROW"     "realbot2_menu 8"
bind "KP_PGUP"        "realbot2_menu 9"
bind "KP_PLUS"        "realbot2_menu +"
bind "KP_MINUS"       "realbot2_menu -"
bind "KP_DEL"         "realbot2_menu close"
bind "KP_ENTER"       "realbot2_menu main"

echo "REALBOT2 numpad menu keys loaded."
